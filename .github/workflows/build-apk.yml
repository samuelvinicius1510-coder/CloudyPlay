name: Build CloudyPlay APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          if [ -z "${ANDROID_HOME}" ]; then
            echo "ANDROID_HOME não está definido no runner."
            exit 1
          fi
          if [ ! -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager não encontrado em ${ANDROID_HOME}/cmdline-tools/latest/bin."
            find "${ANDROID_HOME}" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -20
            exit 1
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required Android SDK packages
        shell: bash
        run: "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudyPlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
